<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fuel Tank </title>
	<style type="text/css">
		body{
			background-color: #F5F5F5;
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;
		}
		.data-container{
			justify-content: space-between;
			width: 80%;
			margin: 50px auto;
			padding: 20px;
			background-color: #FFF;
			box-shadow: 0 2px 20px rgba(0, 0, 0,0.1);
			border-radius: 10px;
		}

		.data-item{
			text-align: center;
		}

		.data-item h2{
			font-size: 24px;
			font-weight: bold;
			margin-bottom: 10px;
		}

		.data-item p{
			font-size: 36px;
			font-weight: bold;
			color: #6EB7FF;
		}

		.data-head{
			margin: auto;
			width: 80%;
			text-align: center;
			font-size: 36px;
			font-weight: bold;
			margin: 50px auto;
			padding: 20px;
			background-color: #FFF;
			box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
			border-radius: 20px;


		}



	</style>
</head>
<body>

	<div class="data-head">Fuel Tank Level</div>

	<div class="data-container">
		<div class="data-item">
			<h2>Temperature</h2>
			<p class="value" id="temperature">22 &#8451;</p>
		</div>
		<div class="data-item">
			<h2>Humidity</h2>
			<p class="value" id="humidity">10%</p>
		</div>
		<div class="data-item">
			<h2>Water Level</h2>
			<p class="value" id="Level">10%</p>
		</div>

		
	</div>

	<!-- the scripts for products you want to access must be added seperatily-->

	<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>

	<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>


	<script type="module">
	  // Import the functions you need from the SDKs you need
	  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
	  // TODO: Add SDKs for Firebase products that you want to use

	  const firebaseConfig = {
  	  apiKey: "AIzaSyAU_5rxTFY3o-CDAxloG2LtzWWEUxyLePg",
  	  authDomain: "waterlevelesp32-75bb9.firebaseapp.com",
  	  databaseURL: "https://waterlevelesp32-75bb9-default-rtdb.firebaseio.com",
    	  projectId: "waterlevelesp32-75bb9",
  	  storageBucket: "waterlevelesp32-75bb9.firebasestorage.app",
  	  messagingSenderId: "203100335703",
  	  appId: "1:203100335703:web:6aab166f771f02b129fd12"
	  };

	  // Initialize Firebase
	  firebase.initializeApp(firebaseConfig);


	  // getting reference to the database
	  var database = firebase.database();

	  //getting reference to the data we want
	  var dataRef1 = database.ref('DHT_11/Humidity');
	  var dataRef2 = database.ref('DHT_11/Temperature');
	  var dataRef3 = database.ref('DHT_11/Level');

	  //fetch the data
	  dataRef1.on('value', function(getdata1){
	  	var humi = getdata1.val();
	  	document.getElementById('humidity').innerHTML = humi + "%";
	  })

	   dataRef2.on('value', function(getdata2){
	  	var temp = getdata2.val();
	  	document.getElementById('temperature').innerHTML = temp + "&#8451;";
	  })
	  
	  dataRef3.on('value', function(getdata3){
	  	var temp = getdata3.val();
	  	document.getElementById('Level').innerHTML = temp + "%";
	  })


	</script>

</body>

</html>
